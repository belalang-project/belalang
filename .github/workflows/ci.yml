name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    env:
      LLVM_REVISION: 30aad2f8981f674f34033feb1fa35254f74e23c1
    strategy:
      matrix:
        os: [ubuntu-latest]
    name: Build and Test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libz-dev libxml2-dev
      - name: Check out LLVM
        uses: actions/checkout@v5
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_REVISION }}
          path: llvm-project
      - name: Cache LLVM build
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: llvm-build
          key: llvm-${{ runner.os }}-${{ env.LLVM_REVISION }}-x86-release-v1
      - name: Build LLVM and MLIR
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          cmake \
            -S llvm-project/llvm \
            -B llvm-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_BUILD_TOOLS=ON
          cmake \
            --build llvm-build \
            --target llvm-libraries mlir-libraries FileCheck not
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBELALANG_LLVM_BUILD_DIR="$PWD/llvm-build"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 8
